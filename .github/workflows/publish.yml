name: Publish

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup corepack
        shell: bash
        run: npm install -g corepack && corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
      - run: |
          yarn install --immutable
          yarn run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: "./dist"
      - id: deployment
        uses: actions/deploy-pages@v4
