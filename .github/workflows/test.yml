name: Test

on:
  push:
    branches:
      - "**"
      - "!main"

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup corepack
        shell: bash
        run: npm install -g corepack && corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
      - run: |
          yarn install --immutable
          yarn run build
